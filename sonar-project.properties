# SonarQube Cloud (sonarcloud.io) – analysed by the "sonarcloud" job in .github/workflows/ci.yml.
# See docs/code-quality.md.
sonar.projectKey=lingoat.games
# Assumption: the SonarQube Cloud organization key is the GitHub owner. Change it if the org key differs.
sonar.organization=arman1371

sonar.sources=src
sonar.tests=src,e2e
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,e2e/**

# Unit-test coverage from `npm run test:coverage` (Vitest, v8 → lcov). Same exclusions as vite.config.ts.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.tsx,src/vite-env.d.ts

# Level packs and the mini-lesson table are learning content (German word lists, sentences, rules); their
# repeated object shape is data, not copy-paste code (Sonar ignores string values when looking for copies).
sonar.cpd.exclusions=src/content/*/**,src/content/lessons.ts

# Fail the scanner step (and so CI) when the quality gate is red.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
